name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so a secret in any commit is caught

      - name: Install gitleaks (checksum-verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks

      - name: Scan full git history
        run: gitleaks git . --redact --no-banner --config .gitleaks.toml --exit-code 1
